<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Cup Tracker | Tournament Hub</title>

   <link rel="stylesheet" href="styles.css">

</head>

<body >
    
    <h2> Create input and button elements </h2>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name"> <br>
    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Enter your age">

    <div id="show-greet">
        
    </div>
    

    <button id="greet-btn">👋 Greet Me!</button>
    <button id="clear-btn" style="background-color: #dc3545;">🧹 Clear</button>

        <h2 id="welcome"> Welcome to the Cup Tracker! </h2>  
        





    <script>
        // Step1
        const greetBtn = document.getElementById('greet-btn');
        const nameInput = document.getElementById('name');
        const ageInput = document.getElementById('age');
        const showGreet = document.getElementById('show-greet');

        const clearBtn = document.getElementById('clear-btn');
        const welcomeHeader = document.getElementById('welcome');

        //Step 2
        greetBtn.addEventListener('click', function() {
            const name = nameInput.value;
            const age = ageInput.value;
            showGreet.textContent = `Hello ${name}! You are ${age} years old.`;
            welcomeHeader.style.color = 'green';
        });

        clearBtn.addEventListener('click', function() {
            nameInput.value = '';
            ageInput.value = '';
            showGreet.textContent = '';
            welcomeHeader.style.color = 'black';
        });



    </script>
 
</body>
</html>
