<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Addition & Multiplication App</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            text-align: center;
            background-color: #f8f9fa;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        input {
            width: 80%;
            padding: 10px;
            margin: 10px 0;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 5px;
        }
        .btn-group {
            margin: 15px 0;
        }
        button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            color: white;
            transition: 0.2s;
        }
        .add-btn { background-color: #28a745; }
        .multiply-btn { background-color: #007bff; }
        button:hover { opacity: 0.9; transform: scale(1.02); }
        .result-card {
            margin-top: 20px;
            padding: 15px;
            background-color: #ffffff;
            border-radius: 8px;
            border: 2px dashed #007bff;
        }
        #result-text {
            color: #333;
            font-size: 24px;
            margin: 0;
        }
    </style>
</head>
<body>

    <h2>🔢 Interactive Number Cruncher</h2>
    <p>Enter two numbers below and pick an operation:</p>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <div class="btn-group">
        <button id="add-btn" class="add-btn">➕ Add Numbers</button>
        <button id="multiply-btn" class="multiply-btn">✖️ Multiply Numbers</button>
    </div>

    <div class="result-card">
        <h3 id="result-text">Result will appear here!</h3>
    </div>

    <script>
        // Select elements
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const addBtn = document.getElementById('add-btn');
        const multiplyBtn = document.getElementById('multiply-btn');
        const resultText = document.getElementById('result-text');

        // Add Event Listener
        addBtn.addEventListener('click', function() {
            let n1 = Number(num1Input.value);
            let n2 = Number(num2Input.value);
            let sum = n1 + n2;
            resultText.textContent = n1 + " + " + n2 + " = " + sum;
        });

        // Multiply Event Listener
        multiplyBtn.addEventListener('click', function() {
            let n1 = Number(num1Input.value);
            let n2 = Number(num2Input.value);
            let product = n1 * n2;
            resultText.textContent = n1 + " × " + n2 + " = " + product;
        });
    </script>
</body>
</html>
