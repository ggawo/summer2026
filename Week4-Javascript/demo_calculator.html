<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo: Addition & Multiplication App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="Enter your name">
    <label for="age">Age</label>
    <input type="number" id="age" placeholder="Enter your age">
    <button id="greet-btn" style="background-color: #17a2b8;">👋 Greet Me!</button>
    <button id="clear-btn" style="background-color: #dc3545;">🧹 Clear</button>

    <div id="show-greet"></div>





    <h2>🔢 Interactive Number Cruncher</h2>
    <p>Enter two numbers below and pick an operation:</p>

    <input type="number" id="num1" placeholder="Enter first number">
    <input type="number" id="num2" placeholder="Enter second number">

    <div class="btn-group">
        <button id="add-btn" class="add-btn">➕ Add Numbers</button>
        <button id="multiply-btn" class="multiply-btn">✖️ Multiply Numbers</button>
    </div>

    <div class="result-card">
        <h3 id="result-text">Result will appear here!</h3>
    </div>

    <script>
        const greetBtn = document.getElementById('greet-btn');
        const showGreet = document.getElementById('show-greet');
        const clearBtn = document.getElementById('clear-btn');
        greetBtn.addEventListener('click', function() {
            const name = document.getElementById('name').value;
            const age = document.getElementById('age').value;
            showGreet.textContent = `Hello ${name}! You are ${age} years old.`;
        });
        clearBtn.addEventListener('click', function() {
            document.getElementById('name').value = '';
            document.getElementById('age').value = '';
            showGreet.textContent = '';
        });


        // Select elements
        const num1Input = document.getElementById('num1');
        const num2Input = document.getElementById('num2');
        const addBtn = document.getElementById('add-btn');
        const multiplyBtn = document.getElementById('multiply-btn');
        const resultText = document.getElementById('result-text');

        // Add Event Listener
        addBtn.addEventListener('click', function() {
            let n1 = Number(num1Input.value);
            let n2 = Number(num2Input.value);
            let sum = n1 + n2;
            resultText.textContent = n1 + " + " + n2 + " = " + sum;
        });

        // Multiply Event Listener
        multiplyBtn.addEventListener('click', function() {
            let n1 = Number(num1Input.value);
            let n2 = Number(num2Input.value);
            let product = n1 * n2;
            resultText.textContent = n1 + " × " + n2 + " = " + product;
        });
    </script>
</body>
</html>
